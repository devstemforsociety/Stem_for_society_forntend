<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8" />

	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Stem For Society</title>
	<!-- Removed external Google Fonts. Poppins is now provided via @fontsource/poppins -->
</head>

<body>
	<div id="root">
		<!--
			Shown until React mounts (React clears this container on first render).
			If the bundle fails to download or throws before mounting, boot-check.js
			turns this into a readable message instead of a blank page.
		-->
		<div id="boot-fallback"
			style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,sans-serif;background:#f8fafc">
			<div style="text-align:center;max-width:520px">
				<div id="boot-spinner"
					style="width:38px;height:38px;margin:0 auto;border:4px solid #dbeafe;border-top-color:#2563eb;border-radius:50%;animation:boot-spin 1s linear infinite">
				</div>
				<div id="boot-message" style="color:#64748b;margin-top:18px;font-size:14px">Loading…</div>
			</div>
		</div>
	</div>

	<noscript>
		<div style="padding:24px;text-align:center;font-family:system-ui,sans-serif">
			This site needs JavaScript to run. Please enable it in your browser settings and reload the page.
		</div>
	</noscript>

	<style>
		@keyframes boot-spin {
			to {
				transform: rotate(360deg);
			}
		}
	</style>

	<script src="/boot-check.js"></script>
	<script type="module" src="/src/main.tsx"></script>
</body>

</html>
